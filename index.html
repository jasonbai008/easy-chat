<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080d" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Easy Chat · 同声传译</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app" id="app">
      <header class="header">
        <div class="brand">
          <!-- <div class="mark" aria-hidden="true"></div> -->
          <img src="favicon.svg" alt="Easy Chat" class="mark" />
          <div class="titles">
            <h1>Easy Chat</h1>
            <p>Gemini 3.5 Live Translate</p>
          </div>
        </div>
        <div class="live-badge">
          <span class="dot"></span>
          <span id="badgeText">离线</span>
          <span id="timerText">00:00</span>
        </div>
      </header>

      <section class="lang-bar">
        <button class="lang-card" id="sourceBtn" type="button">
          <small id="sourceHint">识别</small>
          <strong id="sourceName">自动识别</strong>
        </button>
        <button class="swap" id="swapBtn" type="button" title="交换语言" aria-label="交换语言">⇄</button>
        <button class="lang-card" id="targetBtn" type="button">
          <small>译成</small>
          <strong id="targetName">英语</strong>
        </button>
      </section>

      <main class="stage">
        <section class="panels">
          <article class="panel source">
            <div class="panel-head">
              <b>原文</b>
              <span id="sourceLangTag">AUTO</span>
            </div>
            <div class="log" id="sourceLog">
              <p class="empty" id="sourceEmpty">开始后，这里显示识别出的原文</p>
            </div>
          </article>
          <article class="panel target">
            <div class="panel-head">
              <b>译文</b>
              <span id="targetLangTag">en</span>
            </div>
            <div class="log" id="targetLog">
              <p class="empty" id="targetEmpty">译出的文字会同步出现在这里</p>
            </div>
          </article>
        </section>
      </main>

      <footer class="dock">
        <div class="tools">
          <button class="tool" id="copyBtn" type="button">复制</button>
          <button class="tool" id="clearBtn" type="button">清空</button>
        </div>
        <button class="go" id="actionBtn" type="button">
          <span class="go-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="go-label">开始传译</span>
        </button>
      </footer>
    </div>

    <button class="mask hidden" id="mask" type="button" aria-label="关闭"></button>

    <div class="sheet hidden" id="langSheet">
      <div class="sheet-card">
        <div class="sheet-head">
          <h2 id="langSheetTitle">选择语言</h2>
          <button class="tool" id="closeLangBtn" type="button">关闭</button>
        </div>
        <input class="search" id="langSearch" type="search" placeholder="搜索语言或代码" />
        <div class="quick" id="quickLangs"></div>
        <div class="lang-list" id="langList"></div>
      </div>
    </div>

    <script src="languages.js"></script>
    <script>
      "use strict";

      const MODEL = "gemini-3.5-live-translate-preview";
      const DEFAULT_API_ORIGIN = "https://live.jasonbai.dpdns.org";
      const STORAGE_KEY = "easyTalkTranslate";
      const QUICK_LANGS = ["auto", "zh-Hans", "zh-Hant", "en", "ja", "ko", "fr", "es", "de", "ar", "ru", "pt-BR", "it", "th", "vi", "hi"];

      const LANG_BY_CODE = new Map(LANGUAGES.map((item) => [item.code, item]));

      const appEl = document.getElementById("app");
      const badgeTextEl = document.getElementById("badgeText");
      const timerTextEl = document.getElementById("timerText");
      const actionBtn = document.getElementById("actionBtn");
      const sourceBtn = document.getElementById("sourceBtn");
      const targetBtn = document.getElementById("targetBtn");
      const swapBtn = document.getElementById("swapBtn");
      const sourceNameEl = document.getElementById("sourceName");
      const targetNameEl = document.getElementById("targetName");
      const sourceHintEl = document.getElementById("sourceHint");
      const sourceLangTagEl = document.getElementById("sourceLangTag");
      const targetLangTagEl = document.getElementById("targetLangTag");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");
      const sourceLogEl = document.getElementById("sourceLog");
      const targetLogEl = document.getElementById("targetLog");
      let sourceEmptyEl = document.getElementById("sourceEmpty");
      let targetEmptyEl = document.getElementById("targetEmpty");
      const maskEl = document.getElementById("mask");
      const langSheetEl = document.getElementById("langSheet");
      const langSheetTitleEl = document.getElementById("langSheetTitle");
      const langSearchEl = document.getElementById("langSearch");
      const langListEl = document.getElementById("langList");
      const quickLangsEl = document.getElementById("quickLangs");
      const closeLangBtn = document.getElementById("closeLangBtn");

      let sourceLang = "auto";
      let targetLang = "en";
      let apiOrigin = DEFAULT_API_ORIGIN;
      let pickerSide = "target";

      let ws = null;
      let connected = false;
      let setupComplete = false;
      let connecting = false;
      let talking = false;
      let manualClosing = false;
      let sessionWanted = false;
      let visualState = "idle";
      let setupTimers = [];
      let allowReconnect = false;
      let reconnectAttempts = 0;

      let inputContext = null;
      let outputContext = null;
      let outputGain = null;
      let mediaStream = null;
      let sourceNode = null;
      let processorNode = null;
      let silentGain = null;
      const activeAudioSources = new Set();
      let nextPlayTime = 0;
      let speakingTimer = null;

      let inputLiveEl = null;
      let outputLiveEl = null;
      let inputTranscript = "";
      let outputTranscript = "";
      let inputSealed = "";
      let outputSealed = "";
      let lastInputLang = "";
      const history = [];

      let lastDetectedCode = "";
      let pendingSwitchCode = "";
      let pendingSwitchCount = 0;
      let switchingDirection = false;

      let sessionStartedAt = 0;
      let timerId = 0;
      let screenWakeLock = null;
      let wakeLockWanted = false;
      let wakeLockVideo = null;

      function findLang(code) {
        return LANG_BY_CODE.get(code) || { code, name: code, short: code };
      }

      function normalizeLang(code) {
        if (!code) {
          return "";
        }
        const raw = String(code).trim();
        if (LANG_BY_CODE.has(raw)) {
          return raw;
        }
        const lower = raw.toLowerCase();
        if (lower === "zh" || lower.startsWith("zh-cn") || lower.startsWith("zh-hans")) {
          return "zh-Hans";
        }
        if (lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-hant")) {
          return "zh-Hant";
        }
        if (lower.startsWith("pt-br")) {
          return "pt-BR";
        }
        if (lower.startsWith("pt-pt") || lower === "pt") {
          return "pt-PT";
        }
        let best = "";
        for (const item of LANGUAGES) {
          if (item.code === "auto") {
            continue;
          }
          const itemLower = item.code.toLowerCase();
          if (lower === itemLower || lower.startsWith(itemLower + "-") || itemLower.startsWith(lower + "-")) {
            if (item.code.length > best.length) {
              best = item.code;
            }
          }
        }
        return best || lower.split("-")[0];
      }

      function sameLang(a, b) {
        const left = normalizeLang(a);
        const right = normalizeLang(b);
        return Boolean(left && right && left === right);
      }

      function isTwoWay() {
        return sourceLang !== "auto";
      }

      function liveWsUrl() {
        return apiOrigin.replace(/^http/, "ws") + "/live";
      }

      function loadSettings() {
        const params = new URLSearchParams(location.search);
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (saved.sourceLang) {
            sourceLang = saved.sourceLang;
          }
          if (saved.targetLang) {
            targetLang = saved.targetLang;
          }
          if (saved.apiOrigin) {
            apiOrigin = saved.apiOrigin;
          }
        } catch (_) {}
        if (params.get("api")) {
          apiOrigin = params.get("api");
        }
        if (sourceLang === targetLang && sourceLang !== "auto") {
          targetLang = sourceLang === "zh-Hans" ? "en" : "zh-Hans";
        }
      }

      function saveSettings() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            sourceLang,
            targetLang,
            apiOrigin,
          }),
        );
      }

      function setVisualState(state) {
        visualState = state || "idle";
        appEl.classList.remove("connecting", "live", "listening", "translating", "error");
        if (state && state !== "idle") {
          appEl.classList.add(state);
        }
      }

      const levelTrail = [0, 0, 0, 0];
      let outputLevel = 0;

      function setActionLabel(text) {
        const label = actionBtn.querySelector(".go-label");
        if (label) {
          label.textContent = text;
          return;
        }
        actionBtn.textContent = text;
      }

      function publishLevelVars(level) {
        document.documentElement.style.setProperty("--level", String(level));
        for (let i = 0; i < levelTrail.length; i++) {
          document.documentElement.style.setProperty("--l" + i, String(levelTrail[i]));
        }
      }

      function pushLevel(value) {
        const next = Math.max(0, Math.min(1, value));
        if (next === 0) {
          for (let i = 0; i < levelTrail.length; i++) {
            levelTrail[i] = 0;
          }
          publishLevelVars(0);
          return;
        }
        for (let i = levelTrail.length - 1; i > 0; i--) {
          levelTrail[i] = levelTrail[i - 1];
        }
        levelTrail[0] = next;
        publishLevelVars(next);
      }

      function setMicLevel(value) {
        outputLevel *= 0.82;
        if (outputLevel < 0.02) {
          outputLevel = 0;
        }
        pushLevel(Math.max(value, outputLevel));
      }

      function noteOutputLevel(samples) {
        outputLevel = Math.max(outputLevel, Math.min(1, rmsLevel(samples) * 3.6));
        pushLevel(Math.max(outputLevel, levelTrail[0]));
      }

      function refreshLangUI() {
        const source = findLang(sourceLang);
        const target = findLang(targetLang);
        sourceNameEl.textContent = lastDetectedCode && sourceLang === "auto" ? findLang(lastDetectedCode).name : source.name;
        targetNameEl.textContent = target.name;
        sourceHintEl.textContent = isTwoWay() ? "我说 / 识别" : "识别";
        sourceLangTagEl.textContent = (lastDetectedCode || sourceLang).toUpperCase();
        targetLangTagEl.textContent = targetLang;
        sourceBtn.classList.toggle("active", pickerSide === "source" && langSheetEl.classList.contains("open"));
        targetBtn.classList.toggle("active", pickerSide === "target" && langSheetEl.classList.contains("open"));
      }

      function renderLangPicker() {
        const query = langSearchEl.value.trim().toLowerCase();
        const allowAuto = pickerSide === "source";
        langSheetTitleEl.textContent = pickerSide === "source" ? "选择识别语言" : "选择译入语";
        quickLangsEl.replaceChildren();
        for (const code of QUICK_LANGS) {
          if (code === "auto" && !allowAuto) {
            continue;
          }
          const item = findLang(code);
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip" + (code === (pickerSide === "source" ? sourceLang : targetLang) ? " on" : "");
          chip.textContent = item.short;
          chip.addEventListener("click", () => selectLang(code));
          quickLangsEl.appendChild(chip);
        }
        langListEl.replaceChildren();
        for (const item of LANGUAGES) {
          if (item.code === "auto" && !allowAuto) {
            continue;
          }
          const hay = (item.name + item.short + item.code).toLowerCase();
          if (query && !hay.includes(query)) {
            continue;
          }
          const row = document.createElement("button");
          row.type = "button";
          row.className = "lang-item" + (item.code === (pickerSide === "source" ? sourceLang : targetLang) ? " on" : "");
          row.innerHTML = `<b>${item.name}</b><span>${item.code}</span>`;
          row.addEventListener("click", () => selectLang(item.code));
          langListEl.appendChild(row);
        }
      }

      let sheetHideTimer = 0;

      function openSheet(sheet) {
        clearTimeout(sheetHideTimer);
        maskEl.classList.remove("hidden");
        sheet.classList.remove("hidden");
        refreshLangUI();
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            maskEl.classList.add("open");
            sheet.classList.add("open");
            refreshLangUI();
          });
        });
      }

      function closeSheets() {
        maskEl.classList.remove("open");
        langSheetEl.classList.remove("open");
        refreshLangUI();
        sheetHideTimer = setTimeout(() => {
          if (!langSheetEl.classList.contains("open")) {
            maskEl.classList.add("hidden");
            langSheetEl.classList.add("hidden");
          }
        }, 400);
      }

      function openLangPicker(side) {
        pickerSide = side;
        langSearchEl.value = "";
        renderLangPicker();
        openSheet(langSheetEl);
        setTimeout(() => langSearchEl.focus(), 30);
      }

      async function selectLang(code) {
        if (pickerSide === "source") {
          if (code !== "auto" && sameLang(code, targetLang)) {
            targetLang = sourceLang === "auto" ? (code === "zh-Hans" ? "en" : "zh-Hans") : sourceLang;
          }
          sourceLang = code;
        } else {
          if (sameLang(code, sourceLang)) {
            sourceLang = "auto";
          }
          targetLang = code;
        }
        saveSettings();
        closeSheets();
        refreshLangUI();
        if (sessionWanted) {
          await reconnectSession("已切换语言，正在重新建立译向");
        }
      }

      async function swapLanguages() {
        if (sourceLang === "auto") {
          const detected = lastDetectedCode || (targetLang === "zh-Hans" ? "en" : "zh-Hans");
          sourceLang = targetLang;
          targetLang = detected;
        } else {
          const nextSource = targetLang;
          targetLang = sourceLang;
          sourceLang = nextSource;
        }
        if (sameLang(sourceLang, targetLang)) {
          sourceLang = "auto";
        }
        saveSettings();
        refreshLangUI();
        if (sessionWanted) {
          await reconnectSession("已交换译向，正在重连");
        }
      }

      function hideEmpty(side) {
        if (side === "source" && sourceEmptyEl) {
          sourceEmptyEl.remove();
          sourceEmptyEl = null;
        }
        if (side === "target" && targetEmptyEl) {
          targetEmptyEl.remove();
          targetEmptyEl = null;
        }
      }

      function joinFragment(existing, fragment) {
        if (!fragment) {
          return existing;
        }
        if (!existing) {
          return fragment;
        }
        if (/[A-Za-z0-9]$/.test(existing) && /^[A-Za-z0-9("'“‘]/.test(fragment)) {
          return existing + " " + fragment;
        }
        return existing + fragment;
      }

      function extractCompletedSentences(text) {
        if (!text) {
          return { completed: [], remaining: "" };
        }
        const completed = [];
        const pattern = /[\s\S]*?(?:[。！？…]+|[!?]+|\.(?=\s|$))["'”’）)\]]*/g;
        let lastIndex = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
          if (!match[0]) {
            break;
          }
          const sentence = match[0].replace(/\s+/g, " ").trim();
          if (sentence) {
            completed.push(sentence);
          }
          lastIndex = pattern.lastIndex;
        }
        return { completed, remaining: text.slice(lastIndex) };
      }

      function prependLine(log, el) {
        log.insertBefore(el, log.firstChild);
        log.scrollTop = 0;
      }

      function ensureLiveLine(side) {
        hideEmpty(side);
        const log = side === "source" ? sourceLogEl : targetLogEl;
        let el = side === "source" ? inputLiveEl : outputLiveEl;
        if (el && el.isConnected) {
          log.scrollTop = 0;
          return el;
        }
        el = document.createElement("p");
        el.className = "line live";
        prependLine(log, el);
        if (side === "source") {
          inputLiveEl = el;
        } else {
          outputLiveEl = el;
        }
        return el;
      }

      function addDoneLine(side, text) {
        if (!text) {
          return;
        }
        hideEmpty(side);
        const log = side === "source" ? sourceLogEl : targetLogEl;
        const liveEl = side === "source" ? inputLiveEl : outputLiveEl;
        const el = document.createElement("p");
        el.className = "line done";
        el.textContent = text;
        if (liveEl && liveEl.isConnected) {
          liveEl.insertAdjacentElement("afterend", el);
        } else {
          prependLine(log, el);
        }
        log.scrollTop = 0;
      }

      function finalizeLiveLine(side, text) {
        const liveEl = side === "source" ? inputLiveEl : outputLiveEl;
        if (liveEl && liveEl.isConnected) {
          if (text) {
            liveEl.classList.remove("live");
            liveEl.classList.add("done");
            liveEl.textContent = text;
          } else {
            liveEl.remove();
          }
          if (side === "source") {
            inputLiveEl = null;
          } else {
            outputLiveEl = null;
          }
          return;
        }
        addDoneLine(side, text);
      }

      function rememberSealed(side, text) {
        if (!text) {
          return;
        }
        if (side === "source") {
          inputSealed = inputSealed ? inputSealed + "\n" + text : text;
        } else {
          outputSealed = outputSealed ? outputSealed + "\n" + text : text;
        }
      }

      function appendTranscript(side, fragment) {
        if (!fragment) {
          return;
        }
        if (side === "source") {
          inputTranscript = joinFragment(inputTranscript, fragment);
          const { completed, remaining } = extractCompletedSentences(inputTranscript);
          for (const sentence of completed) {
            rememberSealed("source", sentence);
            finalizeLiveLine("source", sentence);
          }
          inputTranscript = remaining;
          if (remaining) {
            ensureLiveLine("source").textContent = remaining;
          }
        } else {
          outputTranscript = joinFragment(outputTranscript, fragment);
          const { completed, remaining } = extractCompletedSentences(outputTranscript);
          for (const sentence of completed) {
            rememberSealed("target", sentence);
            finalizeLiveLine("target", sentence);
          }
          outputTranscript = remaining;
          if (remaining) {
            ensureLiveLine("target").textContent = remaining;
          }
        }
      }

      function sealSide(side) {
        if (side === "source") {
          if (inputTranscript) {
            rememberSealed("source", inputTranscript);
            finalizeLiveLine("source", inputTranscript);
            inputTranscript = "";
          } else if (inputLiveEl) {
            inputLiveEl.remove();
            inputLiveEl = null;
          }
          return;
        }
        if (outputTranscript) {
          rememberSealed("target", outputTranscript);
          finalizeLiveLine("target", outputTranscript);
          outputTranscript = "";
        } else if (outputLiveEl) {
          outputLiveEl.remove();
          outputLiveEl = null;
        }
      }

      function sealTranscripts() {
        sealSide("source");
        sealSide("target");
        if (inputSealed || outputSealed) {
          history.unshift({
            source: inputSealed,
            target: outputSealed,
            sourceLang: lastInputLang || lastDetectedCode || sourceLang,
            targetLang,
          });
        }
        inputSealed = "";
        outputSealed = "";
        inputTranscript = "";
        outputTranscript = "";
        inputLiveEl = null;
        outputLiveEl = null;
        lastInputLang = "";
      }

      function resetTranscripts(clearHistory) {
        inputTranscript = "";
        outputTranscript = "";
        inputSealed = "";
        outputSealed = "";
        inputLiveEl = null;
        outputLiveEl = null;
        lastInputLang = "";
        if (clearHistory) {
          history.length = 0;
          sourceLogEl.innerHTML = '<p class="empty" id="sourceEmpty">开始后，这里显示识别出的原文</p>';
          targetLogEl.innerHTML = '<p class="empty" id="targetEmpty">译出的文字会同步出现在这里</p>';
          sourceEmptyEl = document.getElementById("sourceEmpty");
          targetEmptyEl = document.getElementById("targetEmpty");
        }
      }

      function formatTime(ms) {
        const total = Math.floor(ms / 1000);
        const minutes = String(Math.floor(total / 60)).padStart(2, "0");
        const seconds = String(total % 60).padStart(2, "0");
        return minutes + ":" + seconds;
      }

      function startTimer() {
        stopTimer();
        sessionStartedAt = Date.now();
        timerTextEl.textContent = "00:00";
        timerId = window.setInterval(() => {
          timerTextEl.textContent = formatTime(Date.now() - sessionStartedAt);
        }, 500);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = 0;
        }
        timerTextEl.textContent = "00:00";
      }

      async function requestScreenWakeLock() {
        wakeLockWanted = true;
        if (document.visibilityState !== "visible") {
          return;
        }
        if (navigator.wakeLock && navigator.wakeLock.request) {
          try {
            if (screenWakeLock) {
              return;
            }
            screenWakeLock = await navigator.wakeLock.request("screen");
            screenWakeLock.addEventListener("release", () => {
              screenWakeLock = null;
            });
            stopWakeLockFallback();
            return;
          } catch (_) {}
        }
        startWakeLockFallback();
      }

      function releaseScreenWakeLock() {
        wakeLockWanted = false;
        if (screenWakeLock) {
          try {
            screenWakeLock.release();
          } catch (_) {}
          screenWakeLock = null;
        }
        stopWakeLockFallback();
      }

      function startWakeLockFallback() {
        if (wakeLockVideo) {
          const playPromise = wakeLockVideo.play();
          if (playPromise && playPromise.catch) {
            playPromise.catch(() => {});
          }
          return;
        }
        const video = document.createElement("video");
        video.setAttribute("playsinline", "");
        video.muted = true;
        video.defaultMuted = true;
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        video.style.cssText = "position:fixed;left:-10px;top:-10px;width:1px;height:1px;opacity:0;pointer-events:none;";
        const canvas = document.createElement("canvas");
        canvas.width = 1;
        canvas.height = 1;
        const ctx = canvas.getContext("2d");
        if (ctx) {
          ctx.fillRect(0, 0, 1, 1);
        }
        if (typeof canvas.captureStream === "function") {
          video.srcObject = canvas.captureStream(1);
        }
        document.body.appendChild(video);
        wakeLockVideo = video;
        const playPromise = video.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(() => {});
        }
      }

      function stopWakeLockFallback() {
        if (!wakeLockVideo) {
          return;
        }
        try {
          wakeLockVideo.pause();
          wakeLockVideo.srcObject = null;
          wakeLockVideo.remove();
        } catch (_) {}
        wakeLockVideo = null;
      }

      function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
          binary += String.fromCharCode(...chunk);
        }
        return btoa(binary);
      }

      function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }

      async function websocketDataToText(data) {
        if (typeof data === "string") {
          return data;
        }
        if (data instanceof Blob) {
          return await data.text();
        }
        if (data instanceof ArrayBuffer) {
          return new TextDecoder("utf-8").decode(data);
        }
        if (ArrayBuffer.isView(data)) {
          return new TextDecoder("utf-8").decode(data.buffer);
        }
        return null;
      }

      function floatTo16BitPCM(float32Array) {
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        for (let i = 0; i < float32Array.length; i++) {
          const sample = Math.max(-1, Math.min(1, float32Array[i]));
          const value = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
          view.setInt16(i * 2, value, true);
        }
        return buffer;
      }

      function downsampleTo16k(buffer, inputSampleRate) {
        if (inputSampleRate === 16000) {
          return buffer;
        }
        const ratio = inputSampleRate / 16000;
        const newLength = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLength);
        let offsetBuffer = 0;
        for (let i = 0; i < newLength; i++) {
          const nextOffsetBuffer = Math.round((i + 1) * ratio);
          let accum = 0;
          let count = 0;
          for (let j = offsetBuffer; j < nextOffsetBuffer && j < buffer.length; j++) {
            accum += buffer[j];
            count++;
          }
          result[i] = count ? accum / count : 0;
          offsetBuffer = nextOffsetBuffer;
        }
        return result;
      }

      function rmsLevel(samples) {
        let sum = 0;
        for (let i = 0; i < samples.length; i++) {
          sum += samples[i] * samples[i];
        }
        return Math.sqrt(sum / samples.length);
      }

      function ensureOutputGraph() {
        if (!outputContext) {
          outputContext = new AudioContext();
        }
        if (!outputGain) {
          outputGain = outputContext.createGain();
          outputGain.connect(outputContext.destination);
        }
        return outputContext;
      }

      function clearSetupTimers() {
        for (const id of setupTimers) {
          clearTimeout(id);
        }
        setupTimers = [];
      }

      function formatError(detail) {
        if (!detail) {
          return "连接失败";
        }
        if (typeof detail === "string") {
          return detail;
        }
        if (detail.message) {
          return detail.message;
        }
        if (detail.error && detail.body) {
          return detail.error + "：" + String(detail.body).slice(0, 180);
        }
        if (detail.error) {
          return typeof detail.error === "string" ? detail.error : JSON.stringify(detail.error);
        }
        try {
          return JSON.stringify(detail);
        } catch (_) {
          return "连接失败";
        }
      }

      function buildSetupMessage() {
        const translationConfig = {
          targetLanguageCode: targetLang,
          echoTargetLanguage: false,
        };
        return {
          setup: {
            model: `models/${MODEL}`,
            generationConfig: {
              responseModalities: ["AUDIO"],
              translationConfig,
            },
            inputAudioTranscription: {},
            outputAudioTranscription: {},
          },
        };
      }

      function sendSetup(reason) {
        if (!ws || ws.readyState !== WebSocket.OPEN || setupComplete) {
          return false;
        }
        const setupMessage = buildSetupMessage();
        console.log("[EASY-TALK] Sending setup:", reason, setupMessage);
        ws.send(JSON.stringify(setupMessage));
        return true;
      }

      function scheduleSetup() {
        clearSetupTimers();
        [500, 1300, 2400].forEach((delay, index) => {
          setupTimers.push(
            setTimeout(() => {
              if (setupComplete) {
                return;
              }
              try {
                sendSetup(index === 0 ? "initial" : "retry-" + index);
              } catch (error) {
                console.error("[EASY-TALK] Setup send failed:", error);
              }
            }, delay),
          );
        });
        setupTimers.push(
          setTimeout(() => {
            if (setupComplete || !ws) {
              return;
            }
            console.error("[EASY-TALK] Setup timeout");
            sessionWanted = false;
            switchingDirection = false;
            allowReconnect = false;
            setVisualState("error");
            try {
              ws.close(1000, "Setup timeout");
            } catch (_) {}
          }, 4200),
        );
      }

      function failSession(message) {
        sessionWanted = false;
        switchingDirection = false;
        allowReconnect = false;
        clearSetupTimers();
        setVisualState("error");
      }

      function maybeSwitchDirection(detectedCode) {
        if (!isTwoWay() || !detectedCode || switchingDirection || connecting) {
          return;
        }
        const detected = normalizeLang(detectedCode);
        const desired = sameLang(detected, targetLang) ? sourceLang : sameLang(detected, sourceLang) ? targetLang : "";
        if (!desired || sameLang(desired, targetLang)) {
          pendingSwitchCode = "";
          pendingSwitchCount = 0;
          return;
        }
        if (pendingSwitchCode === desired) {
          pendingSwitchCount += 1;
        } else {
          pendingSwitchCode = desired;
          pendingSwitchCount = 1;
        }
        if (pendingSwitchCount < 2) {
          return;
        }
        pendingSwitchCode = "";
        pendingSwitchCount = 0;
        sourceLang = targetLang;
        targetLang = desired;
        saveSettings();
        refreshLangUI();
        reconnectSession("检测到对方语言，正在切换译向");
      }

      async function connect() {
        if (connected || connecting) {
          return;
        }
        connecting = true;
        setupComplete = false;
        manualClosing = false;
        actionBtn.disabled = true;
        setActionLabel("正在连接…");
        badgeTextEl.textContent = "连接中";
        setVisualState("connecting");
        const wsUrl = liveWsUrl();
        console.log("[EASY-TALK] Connecting:", wsUrl);
        try {
          ws = new WebSocket(wsUrl);
        } catch (error) {
          connecting = false;
          failSession("WebSocket 创建失败");
          actionBtn.disabled = false;
          setActionLabel("重新开始");
          badgeTextEl.textContent = "离线";
          return;
        }

        ws.onopen = () => {
          connected = true;
          connecting = false;
          scheduleSetup();
        };

        ws.onmessage = handleGeminiMessage;
        ws.onerror = () => {
          setVisualState("error");
        };
        ws.onclose = (event) => {
          console.log("[EASY-TALK] WebSocket closed:", event.code, event.reason);
          clearSetupTimers();
          const shouldSwitch = switchingDirection;
          const shouldRetry = allowReconnect && reconnectAttempts < 1;
          switchingDirection = false;
          allowReconnect = false;
          connected = false;
          connecting = false;
          setupComplete = false;
          stopMicrophone(false);
          stopAudioPlayback();
          if (sessionWanted && !manualClosing && (shouldSwitch || shouldRetry)) {
            if (shouldRetry) {
              reconnectAttempts += 1;
            }
            badgeTextEl.textContent = "重连中";
            setVisualState("connecting");
            window.setTimeout(
              () => {
                if (sessionWanted && !manualClosing) {
                  connect();
                }
              },
              shouldSwitch ? 200 : 500,
            );
            return;
          }
          sessionWanted = false;
          actionBtn.disabled = false;
          setActionLabel(manualClosing ? "开始传译" : "重新开始");
          actionBtn.classList.remove("stop");
          badgeTextEl.textContent = "离线";
          setVisualState(manualClosing ? "idle" : "error");
          releaseScreenWakeLock();
          stopTimer();
          sealTranscripts();
        };
      }

      async function handleGeminiMessage(event) {
        const text = await websocketDataToText(event.data);
        if (!text) {
          return;
        }
        let message;
        try {
          message = JSON.parse(text);
        } catch (_) {
          return;
        }

        if (message.setupComplete) {
          console.log("[EASY-TALK] setupComplete");
          setupComplete = true;
          allowReconnect = true;
          reconnectAttempts = 0;
          switchingDirection = false;
          clearSetupTimers();
          actionBtn.disabled = false;
          setActionLabel("结束传译");
          actionBtn.classList.add("stop");
          badgeTextEl.textContent = "传译中";
          setVisualState("listening");
          if (!timerId) {
            startTimer();
          }
          try {
            await startMicrophone();
          } catch (error) {
            stopMicrophone(false);
            setVisualState("error");
          }
          return;
        }

        if (message.type === "error" || message.error) {
          console.error("[EASY-TALK] Gemini/proxy error:", message);
          failSession(formatError(message));
          return;
        }

        const serverContent = message.serverContent;
        if (!serverContent) {
          return;
        }

        if (serverContent.inputTranscription) {
          const fragment = serverContent.inputTranscription.text || "";
          const langCode = normalizeLang(serverContent.inputTranscription.languageCode || "");
          if (langCode && lastInputLang && !sameLang(langCode, lastInputLang) && inputTranscript) {
            sealTranscripts();
          }
          if (langCode) {
            lastInputLang = langCode;
            lastDetectedCode = langCode;
            refreshLangUI();
            maybeSwitchDirection(langCode);
          }
          appendTranscript("source", fragment);
          if (serverContent.inputTranscription.finished) {
            sealSide("source");
          }
        }

        if (serverContent.outputTranscription) {
          appendTranscript("target", serverContent.outputTranscription.text || "");
          if (serverContent.outputTranscription.finished) {
            sealSide("target");
          }
        }

        if (serverContent.modelTurn && Array.isArray(serverContent.modelTurn.parts)) {
          for (const part of serverContent.modelTurn.parts) {
            if (part.inlineData && part.inlineData.data) {
              playPCM(part.inlineData.data);
            }
          }
        }

        if (serverContent.interrupted) {
          stopAudioPlayback();
          sealTranscripts();
        }

        if (serverContent.generationComplete) {
          sealTranscripts();
        }

        if (serverContent.turnComplete) {
          sealTranscripts();
          if (talking) {
            setVisualState("listening");
          }
        }
      }

      async function startMicrophone() {
        if (!connected || !setupComplete || talking) {
          return;
        }
        if (mediaStream || processorNode || inputContext) {
          stopMicrophone(false);
        }
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        inputContext = new AudioContext();
        await inputContext.resume();
        ensureOutputGraph();
        await outputContext.resume();
        sourceNode = inputContext.createMediaStreamSource(mediaStream);
        processorNode = inputContext.createScriptProcessor(4096, 1, 1);
        processorNode.onaudioprocess = (event) => {
          if (!talking || !ws || ws.readyState !== WebSocket.OPEN || !setupComplete) {
            return;
          }
          const input = event.inputBuffer.getChannelData(0);
          setMicLevel(Math.min(1, rmsLevel(input) * 4.2));
          const downsampled = downsampleTo16k(input, inputContext.sampleRate);
          const message = {
            realtimeInput: {
              audio: {
                data: arrayBufferToBase64(floatTo16BitPCM(downsampled)),
                mimeType: "audio/pcm;rate=16000",
              },
            },
          };
          try {
            ws.send(JSON.stringify(message));
          } catch (_) {}
        };
        sourceNode.connect(processorNode);
        silentGain = inputContext.createGain();
        silentGain.gain.value = 0;
        processorNode.connect(silentGain);
        silentGain.connect(inputContext.destination);
        talking = true;
        setVisualState("listening");
      }

      function stopMicrophone(sendAudioStreamEnd) {
        const wasTalking = talking;
        talking = false;
        outputLevel = 0;
        setMicLevel(0);
        if (sendAudioStreamEnd && wasTalking && ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
          } catch (_) {}
        }
        if (processorNode) {
          try {
            processorNode.disconnect();
          } catch (_) {}
          processorNode.onaudioprocess = null;
          processorNode = null;
        }
        if (silentGain) {
          try {
            silentGain.disconnect();
          } catch (_) {}
          silentGain = null;
        }
        if (sourceNode) {
          try {
            sourceNode.disconnect();
          } catch (_) {}
          sourceNode = null;
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => {
            try {
              track.stop();
            } catch (_) {}
          });
          mediaStream = null;
        }
        if (inputContext) {
          try {
            inputContext.close();
          } catch (_) {}
          inputContext = null;
        }
      }

      async function playPCM(base64) {
        if (!base64) {
          return;
        }
        const context = ensureOutputGraph();
        if (context.state === "suspended") {
          try {
            await context.resume();
          } catch (_) {
            return;
          }
        }
        const int16 = new Int16Array(base64ToArrayBuffer(base64));
        if (!int16.length) {
          return;
        }
        const audioBuffer = context.createBuffer(1, int16.length, 24000);
        const channel = audioBuffer.getChannelData(0);
        for (let i = 0; i < int16.length; i++) {
          channel[i] = int16[i] / 32768;
        }
        noteOutputLevel(channel);
        const source = context.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(outputGain);
        activeAudioSources.add(source);
        source.onended = () => {
          activeAudioSources.delete(source);
        };
        const now = context.currentTime;
        if (nextPlayTime < now) {
          nextPlayTime = now;
        }
        try {
          source.start(nextPlayTime);
          nextPlayTime += audioBuffer.duration;
          setVisualState("translating");
          if (speakingTimer) {
            clearTimeout(speakingTimer);
          }
          const remainingMs = Math.max(0, (nextPlayTime - context.currentTime) * 1000);
          speakingTimer = setTimeout(() => {
            if (talking) {
              setVisualState("listening");
            }
          }, remainingMs + 160);
        } catch (_) {
          activeAudioSources.delete(source);
        }
      }

      function stopAudioPlayback() {
        for (const source of activeAudioSources) {
          try {
            source.stop();
          } catch (_) {}
          try {
            source.disconnect();
          } catch (_) {}
        }
        activeAudioSources.clear();
        if (speakingTimer) {
          clearTimeout(speakingTimer);
          speakingTimer = null;
        }
        nextPlayTime = outputContext ? outputContext.currentTime : 0;
        outputLevel = 0;
      }

      async function reconnectSession(reason) {
        switchingDirection = true;
        allowReconnect = false;
        clearSetupTimers();
        badgeTextEl.textContent = "切换中";
        setVisualState("connecting");
        stopMicrophone(false);
        stopAudioPlayback();
        sealTranscripts();
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          try {
            ws.close(1000, "Retarget");
          } catch (_) {}
        } else if (sessionWanted) {
          connect();
        }
      }

      async function startSession() {
        sessionWanted = true;
        manualClosing = false;
        allowReconnect = false;
        reconnectAttempts = 0;
        switchingDirection = false;
        await requestScreenWakeLock();
        await connect();
      }

      function stopSession() {
        sessionWanted = false;
        switchingDirection = false;
        allowReconnect = false;
        clearSetupTimers();
        manualClosing = true;
        actionBtn.disabled = true;
        releaseScreenWakeLock();
        stopMicrophone(true);
        stopAudioPlayback();
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
          try {
            ws.close(1000, "Session ended");
          } catch (_) {}
        } else {
          actionBtn.disabled = false;
          setActionLabel("开始传译");
          actionBtn.classList.remove("stop");
          badgeTextEl.textContent = "离线";
          setVisualState("idle");
          stopTimer();
          sealTranscripts();
        }
      }

      actionBtn.addEventListener("click", async () => {
        if (connected || connecting || sessionWanted) {
          stopSession();
          return;
        }
        await startSession();
      });

      sourceBtn.addEventListener("click", () => openLangPicker("source"));
      targetBtn.addEventListener("click", () => openLangPicker("target"));
      swapBtn.addEventListener("click", () => {
        swapLanguages();
      });
      copyBtn.addEventListener("click", async () => {
        const collect = (log) => [...log.querySelectorAll(".line")].map((el) => el.textContent.trim()).filter(Boolean);
        const sourceLines = collect(sourceLogEl);
        const targetLines = collect(targetLogEl);
        const text =
          [sourceLines.length ? "原文\n" + sourceLines.join("\n") : "", targetLines.length ? "译文\n" + targetLines.join("\n") : ""].filter(Boolean).join("\n\n") ||
          "还没有可复制的字幕";
        try {
          await navigator.clipboard.writeText(text);
        } catch (_) {}
      });
      clearBtn.addEventListener("click", () => {
        resetTranscripts(true);
      });
      closeLangBtn.addEventListener("click", closeSheets);
      maskEl.addEventListener("click", closeSheets);
      langSearchEl.addEventListener("input", renderLangPicker);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && wakeLockWanted) {
          requestScreenWakeLock();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.code !== "Space" || event.repeat) {
          return;
        }
        const tag = (event.target && event.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") {
          return;
        }
        event.preventDefault();
        actionBtn.click();
      });

      window.addEventListener("beforeunload", () => {
        manualClosing = true;
        sessionWanted = false;
        clearSetupTimers();
        releaseScreenWakeLock();
        stopMicrophone(false);
        stopAudioPlayback();
        if (ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.close(1000, "Page closed");
          } catch (_) {}
        }
      });

      loadSettings();
      refreshLangUI();
    </script>
  </body>
</html>
