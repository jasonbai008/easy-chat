<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080d" />
  <link rel="icon" type="image/svg+xml"
    href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="%2307080d"/><path d="M14 32c8-12 28-12 36 0" fill="none" stroke="%233ee0c5" stroke-width="4" stroke-linecap="round"/><path d="M20 32c5-7 19-7 24 0" fill="none" stroke="%23ffb45a" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="%23fff"/></svg>'>
  <title>Easy Talk · 同声传译</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #07080d;
      --ink: #f4f7fb;
      --muted: #8b93a7;
      --line: rgba(255, 255, 255, 0.08);
      --glass: rgba(16, 18, 28, 0.72);
      --cyan: #3ee0c5;
      --amber: #ffb45a;
      --danger: #ff6b8a;
      --ok: #5ee0a8;
      --level: 0;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "SF Pro Display", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 0%, rgba(62, 224, 197, 0.16), transparent 32%),
        radial-gradient(circle at 88% 100%, rgba(255, 180, 90, 0.12), transparent 34%),
        linear-gradient(180deg, #0b0d14 0%, #07080d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 0.7px, transparent 0.7px);
      background-size: 20px 20px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100svh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
      padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
      max-width: 880px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(62, 224, 197, 0.9), rgba(255, 180, 90, 0.85));
      box-shadow: 0 8px 24px rgba(62, 224, 197, 0.18);
      flex: none;
    }

    .titles {
      min-width: 0;
    }

    .titles h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.04em;
    }

    .titles p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      color: var(--muted);
      font-size: 12px;
      backdrop-filter: blur(16px);
      flex: none;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #667085;
      box-shadow: 0 0 0 4px rgba(102, 112, 133, 0.12);
    }

    .app.connecting .dot {
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(255, 180, 90, 0.16);
    }

    .app.live .dot,
    .app.listening .dot {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(94, 224, 168, 0.16);
    }

    .app.translating .dot {
      background: var(--cyan);
      box-shadow: 0 0 0 4px rgba(62, 224, 197, 0.2);
    }

    .app.error .dot {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 107, 138, 0.16);
    }

    .lang-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .lang-card {
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--glass);
      text-align: left;
      backdrop-filter: blur(16px);
      transition: border-color 0.2s, transform 0.2s;
    }

    .lang-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .lang-card.active {
      border-color: rgba(62, 224, 197, 0.45);
      box-shadow: inset 0 0 0 1px rgba(62, 224, 197, 0.12);
    }

    .lang-card small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .lang-card strong {
      display: block;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swap {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font-size: 18px;
    }

    .swap:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .stage {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .console {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
    }

    .orb {
      --size: 92px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .orb::before {
      background: conic-gradient(from 180deg, var(--cyan), var(--amber), #7c6bff, var(--cyan));
      filter: blur(10px);
      opacity: calc(0.28 + var(--level) * 0.55);
      transform: scale(calc(0.86 + var(--level) * 0.18));
      animation: spin 8s linear infinite;
    }

    .app.live .orb::before,
    .app.listening .orb::before,
    .app.translating .orb::before {
      animation-duration: 4.5s;
    }

    .orb::after {
      inset: 14%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), transparent 28%),
        radial-gradient(circle at 50% 50%, #1a2030, #0b0d14 72%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .orb-core {
      position: relative;
      z-index: 1;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d9e2ea;
      box-shadow: 0 0 18px rgba(62, 224, 197, 0.45);
    }

    .app.translating .orb-core {
      background: var(--cyan);
    }

    .app.listening .orb-core {
      background: var(--amber);
    }

    .meta {
      min-width: 0;
    }

    .status {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.45;
    }

    .status.error {
      color: var(--danger);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 12px;
    }

    .chip.on {
      color: var(--ink);
      border-color: rgba(62, 224, 197, 0.28);
      background: rgba(62, 224, 197, 0.08);
    }

    .panels {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(10, 12, 20, 0.55);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .panel-head b {
      color: var(--ink);
      font-weight: 650;
    }

    .panel.source .panel-head b {
      color: var(--cyan);
    }

    .panel.target .panel-head b {
      color: var(--amber);
    }

    .log {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 4px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .line {
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line.live {
      color: #d7deea;
    }

    .line.done {
      color: #aeb6c7;
    }

    .empty {
      margin: auto 0;
      color: #667085;
      font-size: 13px;
      text-align: center;
    }

    .dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool {
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 13px;
    }

    .tool.on {
      color: var(--ink);
      border-color: rgba(255, 180, 90, 0.35);
      background: rgba(255, 180, 90, 0.1);
    }

    .go {
      min-width: 148px;
      padding: 13px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #46ebc8, #2fbfc4 55%, #f0b15b);
      color: #081018;
      font-weight: 750;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 30px rgba(62, 224, 197, 0.22);
    }

    .go.stop {
      background: linear-gradient(135deg, #ff7d95, #ff5d7a);
      color: white;
      box-shadow: 0 10px 30px rgba(255, 93, 122, 0.2);
    }

    .mask,
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
    }

    .mask {
      border: 0;
      width: 100%;
      background: rgba(4, 6, 10, 0.55);
      backdrop-filter: blur(8px);
    }

    .sheet {
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }

    .sheet-card {
      pointer-events: auto;
      width: min(560px, 100%);
      max-height: min(78svh, 720px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #12141c;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 10px;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .search {
      margin: 0 16px 10px;
      width: calc(100% - 32px);
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0c0e14;
      outline: none;
    }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 10px;
    }

    .lang-list {
      overflow: auto;
      padding: 0 8px 12px;
    }

    .lang-item {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .lang-item:hover,
    .lang-item.on {
      background: rgba(255, 255, 255, 0.05);
    }

    .lang-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .settings {
      padding: 0 16px 16px;
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .field input[type="range"] {
      width: 100%;
    }

    .field input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0c0e14;
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg) scale(calc(0.86 + var(--level) * 0.18));
      }
    }

    @media (max-width: 720px) {
      .app {
        gap: 12px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .console {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .chips {
        justify-content: center;
      }

      .panels {
        grid-template-columns: 1fr;
      }

      .dock {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      .go {
        width: 100%;
      }

      .tools {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <header class="header">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M2 9c3.5-5 10.5-5 14 0" stroke="#081018" stroke-width="1.8" stroke-linecap="round" />
            <path d="M5 9c2-3 6-3 8 0" stroke="#081018" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </div>
        <div class="titles">
          <h1>Easy Talk</h1>
          <p>Gemini 3.5 Live Translate</p>
        </div>
      </div>
      <div class="live-badge">
        <span class="dot"></span>
        <span id="badgeText">离线</span>
        <span id="timerText">00:00</span>
      </div>
    </header>

    <section class="lang-bar">
      <button class="lang-card" id="sourceBtn" type="button">
        <small id="sourceHint">识别</small>
        <strong id="sourceName">自动识别</strong>
      </button>
      <button class="swap" id="swapBtn" type="button" title="交换语言" aria-label="交换语言">⇄</button>
      <button class="lang-card" id="targetBtn" type="button">
        <small>译成</small>
        <strong id="targetName">中文（简体）</strong>
      </button>
    </section>

    <main class="stage">
      <section class="console">
        <div class="orb" id="orb" aria-hidden="true">
          <div class="orb-core"></div>
        </div>
        <div class="meta">
          <p class="status" id="status">选择译入语，开始后对着麦克风说话。模型会自动识别来源语言并实时译出语音。</p>
          <div class="chips">
            <span class="chip" id="modeChip">单向传译</span>
            <span class="chip" id="detectChip">来源未识别</span>
            <span class="chip" id="echoChip">已说目标语时静音</span>
          </div>
        </div>
      </section>

      <section class="panels">
        <article class="panel source">
          <div class="panel-head">
            <b>原文</b>
            <span id="sourceLangTag">AUTO</span>
          </div>
          <div class="log" id="sourceLog">
            <p class="empty" id="sourceEmpty">开始后，这里显示识别出的原文</p>
          </div>
        </article>
        <article class="panel target">
          <div class="panel-head">
            <b>译文</b>
            <span id="targetLangTag">zh-Hans</span>
          </div>
          <div class="log" id="targetLog">
            <p class="empty" id="targetEmpty">译出的文字会同步出现在这里</p>
          </div>
        </article>
      </section>
    </main>

    <footer class="dock">
      <div class="tools">
        <button class="tool" id="echoBtn" type="button">回声</button>
        <button class="tool" id="muteBtn" type="button">静音</button>
        <button class="tool" id="copyBtn" type="button">复制</button>
        <button class="tool" id="clearBtn" type="button">清空</button>
        <button class="tool" id="settingsBtn" type="button">设置</button>
      </div>
      <button class="go" id="actionBtn" type="button">开始传译</button>
    </footer>
  </div>

  <button class="mask hidden" id="mask" type="button" aria-label="关闭"></button>

  <div class="sheet hidden" id="langSheet">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="langSheetTitle">选择语言</h2>
        <button class="tool" id="closeLangBtn" type="button">关闭</button>
      </div>
      <input class="search" id="langSearch" type="search" placeholder="搜索语言或代码" />
      <div class="quick" id="quickLangs"></div>
      <div class="lang-list" id="langList"></div>
    </div>
  </div>

  <div class="sheet hidden" id="settingsSheet">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>设置</h2>
        <button class="tool" id="closeSettingsBtn" type="button">关闭</button>
      </div>
      <div class="settings">
        <div class="field">
          <label for="volume">译文音量</label>
          <input id="volume" type="range" min="0" max="100" value="100" />
        </div>
        <div class="field">
          <label for="apiOrigin">Worker 地址</label>
          <input id="apiOrigin" type="text" spellcheck="false" />
        </div>
        <p class="empty">双向模式：把左侧改成具体语言。模型听出该语言时译向右侧，听出右侧语言时自动换向。</p>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const MODEL = "gemini-3.5-live-translate-preview";
    const DEFAULT_API_ORIGIN = "https://live.jasonbai.dpdns.org";
    const STORAGE_KEY = "easyTalkTranslate";
    const QUICK_LANGS = ["auto", "zh-Hans", "zh-Hant", "en", "ja", "ko", "fr", "es", "de", "ar", "ru", "pt-BR", "it", "th", "vi", "hi"];

    const LANGUAGES = [
      { code: "auto", name: "自动识别", short: "自动" },
      { code: "zh-Hans", name: "中文（简体）", short: "中文" },
      { code: "zh-Hant", name: "中文（繁体）", short: "繁中" },
      { code: "en", name: "英语", short: "EN" },
      { code: "ja", name: "日语", short: "日本語" },
      { code: "ko", name: "韩语", short: "한국어" },
      { code: "fr", name: "法语", short: "FR" },
      { code: "es", name: "西班牙语", short: "ES" },
      { code: "de", name: "德语", short: "DE" },
      { code: "ar", name: "阿拉伯语", short: "AR" },
      { code: "ru", name: "俄语", short: "RU" },
      { code: "pt-BR", name: "葡萄牙语（巴西）", short: "PT-BR" },
      { code: "pt-PT", name: "葡萄牙语（葡萄牙）", short: "PT" },
      { code: "it", name: "意大利语", short: "IT" },
      { code: "th", name: "泰语", short: "TH" },
      { code: "vi", name: "越南语", short: "VI" },
      { code: "hi", name: "印地语", short: "HI" },
      { code: "id", name: "印尼语", short: "ID" },
      { code: "tr", name: "土耳其语", short: "TR" },
      { code: "pl", name: "波兰语", short: "PL" },
      { code: "nl", name: "荷兰语", short: "NL" },
      { code: "sv", name: "瑞典语", short: "SV" },
      { code: "uk", name: "乌克兰语", short: "UK" },
      { code: "he", name: "希伯来语", short: "HE" },
      { code: "fa", name: "波斯语", short: "FA" },
      { code: "cs", name: "捷克语", short: "CS" },
      { code: "el", name: "希腊语", short: "EL" },
      { code: "ro", name: "罗马尼亚语", short: "RO" },
      { code: "hu", name: "匈牙利语", short: "HU" },
      { code: "fi", name: "芬兰语", short: "FI" },
      { code: "da", name: "丹麦语", short: "DA" },
      { code: "no", name: "挪威语", short: "NO" },
      { code: "nb", name: "书面挪威语", short: "NB" },
      { code: "sk", name: "斯洛伐克语", short: "SK" },
      { code: "bg", name: "保加利亚语", short: "BG" },
      { code: "hr", name: "克罗地亚语", short: "HR" },
      { code: "sr", name: "塞尔维亚语", short: "SR" },
      { code: "sl", name: "斯洛文尼亚语", short: "SL" },
      { code: "lt", name: "立陶宛语", short: "LT" },
      { code: "lv", name: "拉脱维亚语", short: "LV" },
      { code: "et", name: "爱沙尼亚语", short: "ET" },

    function findLang(code) {
      return LANG_BY_CODE.get(code) || { code, name: code, short: code };
    }

    function normalizeLang(code) {
      if (!code) {
        return "";
      }
      const raw = String(code).trim();
      if (LANG_BY_CODE.has(raw)) {
        return raw;
      }
      const lower = raw.toLowerCase();
      if (lower === "zh" || lower.startsWith("zh-cn") || lower.startsWith("zh-hans")) {
        return "zh-Hans";
      }
      if (lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-hant")) {
        return "zh-Hant";
      }
      if (lower.startsWith("pt-br")) {
        return "pt-BR";
      }
      if (lower.startsWith("pt-pt") || lower === "pt") {
        return "pt-PT";
      }
      let best = "";
      for (const item of LANGUAGES) {
        if (item.code === "auto") {
          continue;
        }
        const itemLower = item.code.toLowerCase();
        if (lower === itemLower || lower.startsWith(itemLower + "-") || itemLower.startsWith(lower + "-")) {
          if (item.code.length > best.length) {
            best = item.code;
          }
        }
      }
      return best || lower.split("-")[0];
    }

    function sameLang(a, b) {
      const left = normalizeLang(a);
      const right = normalizeLang(b);
      return Boolean(left && right && left === right);
    }

    function startWakeLockFallback() {
      if (wakeLockVideo) {
        const playPromise = wakeLockVideo.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(() => { });
        }
        return;
      }
      const video = document.createElement("video");
      video.setAttribute("playsinline", "");
      video.muted = true;
      video.defaultMuted = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.style.cssText = "position:fixed;left:-10px;top:-10px;width:1px;height:1px;opacity:0;pointer-events:none;";
      const canvas = document.createElement("canvas");
      canvas.width = 1;
      canvas.height = 1;
      const ctx = canvas.getContext("2d");
      if (ctx) {
        ctx.fillRect(0, 0, 1, 1);
      }
      if (typeof canvas.captureStream === "function") {
        video.srcObject = canvas.captureStream(1);
      }
      document.body.appendChild(video);
      wakeLockVideo = video;
      const playPromise = video.play();
      if (playPromise && playPromise.catch) {
        playPromise.catch(() => { });
      }
    }

      if (!wakeLockVideo) {
        return;

      try {

        wakeLockVideo.srcObject = null;
        wakeLockVideo.remove();
      } catch (_) { }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function websocketDataToText(data) {
      if (typeof data === "string") {
        return data;
      }
      if (data instanceof Blob) {
        return await data.text();
      }
      if (data instanceof ArrayBuffer) {
        return new TextDecoder("utf-8").decode(data);
      }
      if (ArrayBuffer.isView(data)) {
        return new TextDecoder("utf-8").decode(data.buffer);
      }
      return null;
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < float32Array.length; i++) {
        const sample = Math.max(-1, Math.min(1, float32Array[i]));
        const value = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        view.setInt16(i * 2, value, true);
      }
      return buffer;
    }

    function downsampleTo16k(buffer, inputSampleRate) {
      if (inputSampleRate === 16000) {
        return buffer;
      }
      const ratio = inputSampleRate / 16000;
      const newLength = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLength);
      let offsetBuffer = 0;
      for (let i = 0; i < newLength; i++) {
        const nextOffsetBuffer = Math.round((i + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let j = offsetBuffer; j < nextOffsetBuffer && j < buffer.length; j++) {
          accum += buffer[j];
          count++;
        }
        result[i] = count ? accum / count : 0;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function rmsLevel(samples) {
      let sum = 0;
      for (let i = 0; i < samples.length; i++) {
        sum += samples[i] * samples[i];
      }
      return Math.sqrt(sum / samples.length);
    }

      if (!outputContext) {

    function formatError(detail) {
      if (!detail) {
        return "连接失败";
      }
      if (typeof detail === "string") {
        return detail;
      }
      if (detail.message) {
        return detail.message;
      }
      if (detail.error && detail.body) {
        return detail.error + "：" + String(detail.body).slice(0, 180);
      }
      if (detail.error) {
        return typeof detail.error === "string" ? detail.error : JSON.stringify(detail.error);
      }
      try {
        return JSON.stringify(detail);
      } catch (_) {
        return "连接失败";
      }
    }

    function buildSetupMessage() {
      const translationConfig = {
        targetLanguageCode: targetLang,
        echoTargetLanguage: isTwoWay() ? false : echoTargetLanguage
      };
      return {
        setup: {
          model: `models/${MODEL}`,
          generationConfig: {
            responseModalities: ["AUDIO"],
            translationConfig
          },
          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      };
    }

    function sendSetup(reason) {
      if (!ws || ws.readyState !== WebSocket.OPEN || setupComplete) {
        return false;
      }
      const setupMessage = buildSetupMessage();
      console.log("[EASY-TALK] Sending setup:", reason, setupMessage);
      ws.send(JSON.stringify(setupMessage));
      setStatus("正在初始化译向 " + findLang(targetLang).name + "…");
      return true;
    }

    function scheduleSetup() {
      clearSetupTimers();
      [500, 1300, 2400].forEach((delay, index) => {
        setupTimers.push(setTimeout(() => {
          if (setupComplete) {
            return;
          }
          try {
            sendSetup(index === 0 ? "initial" : "retry-" + index);
          } catch (error) {
            console.error("[EASY-TALK] Setup send failed:", error);
            setStatus("发送 setup 失败", "error");
          }
        }, delay));
      });
      setupTimers.push(setTimeout(() => {
        if (setupComplete || !ws) {
          return;
        }
        console.error("[EASY-TALK] Setup timeout");
        sessionWanted = false;
        switchingDirection = false;
        allowReconnect = false;
        setStatus("Gemini 初始化超时。Worker 可能还没连上，请再点一次开始。", "error");
        setVisualState("error");
        try {
          ws.close(1000, "Setup timeout");
        } catch (_) { }
      }, 4200));
    }

    function failSession(message) {
      sessionWanted = false;
      switchingDirection = false;
      allowReconnect = false;
      clearSetupTimers();
      setStatus(message, "error");
      setVisualState("error");
    }

    function maybeSwitchDirection(detectedCode) {
      if (!isTwoWay() || !detectedCode || switchingDirection || connecting) {
        return;
      }
      const detected = normalizeLang(detectedCode);
      const desired = sameLang(detected, targetLang)
        ? sourceLang
        : sameLang(detected, sourceLang)
          ? targetLang
          : "";
      if (!desired || sameLang(desired, targetLang)) {
        pendingSwitchCode = "";
        pendingSwitchCount = 0;
        return;
      }
      if (pendingSwitchCode === desired) {
        pendingSwitchCount += 1;
      } else {
        pendingSwitchCode = desired;
        pendingSwitchCount = 1;
      }
      if (pendingSwitchCount < 2) {
        return;
      }
      pendingSwitchCode = "";
      pendingSwitchCount = 0;
      sourceLang = targetLang;
      targetLang = desired;
      saveSettings();
      refreshLangUI();
      reconnectSession("检测到对方语言，正在切换译向");
    }

    async function connect() {
      if (connected || connecting) {
        return;
      }
      connecting = true;
      setupComplete = false;
      manualClosing = false;
      actionBtn.disabled = true;
      actionBtn.textContent = "正在连接…";
      badgeTextEl.textContent = "连接中";
      setVisualState("connecting");
      setStatus("正在连接 Live Translate…");
      const wsUrl = liveWsUrl();
      console.log("[EASY-TALK] Connecting:", wsUrl);
      try {
        ws = new WebSocket(wsUrl);
      } catch (error) {
        connecting = false;
        failSession("WebSocket 创建失败");
        actionBtn.disabled = false;
        actionBtn.textContent = "重新开始";
        badgeTextEl.textContent = "离线";
        return;
      }

      ws.onopen = () => {
        connected = true;
        connecting = false;
        setStatus("通道已打开，等待 Worker 接通 Gemini…");
        scheduleSetup();
      };

      ws.onmessage = handleGeminiMessage;
      ws.onerror = () => {
        setStatus("WebSocket 连接出错", "error");
        setVisualState("error");
      };
      ws.onclose = (event) => {
        console.log("[EASY-TALK] WebSocket closed:", event.code, event.reason);
        clearSetupTimers();
        const shouldSwitch = switchingDirection;
        const shouldRetry = allowReconnect && reconnectAttempts < 1;
        switchingDirection = false;
        allowReconnect = false;
        connected = false;
        connecting = false;
        setupComplete = false;
        stopMicrophone(false);
        stopAudioPlayback();
        if (sessionWanted && !manualClosing && (shouldSwitch || shouldRetry)) {
          if (shouldRetry) {
            reconnectAttempts += 1;
          }
          setStatus(shouldSwitch ? "正在按新译向重连…" : "连接中断，正在重试一次…");
          badgeTextEl.textContent = "重连中";
          setVisualState("connecting");
          window.setTimeout(() => {
            if (sessionWanted && !manualClosing) {
              connect();
            }
          }, shouldSwitch ? 200 : 500);
          return;
        }
        sessionWanted = false;
        actionBtn.disabled = false;
        actionBtn.textContent = manualClosing ? "开始传译" : "重新开始";
        actionBtn.classList.remove("stop");
        badgeTextEl.textContent = "离线";
        setVisualState(manualClosing ? "idle" : "error");
        releaseScreenWakeLock();
        stopTimer();
        sealTranscripts();
        if (!manualClosing && visualState === "error") {
          if (!statusEl.classList.contains("error")) {
            setStatus(event.reason ? "连接已中断：" + event.reason : "连接已中断，请重新开始", "error");
          }
        } else if (manualClosing) {
          setStatus("传译已结束，随时可以再次开始");
        }
      };
    }

    async function handleGeminiMessage(event) {
      const text = await websocketDataToText(event.data);
      if (!text) {
        return;
      }
      let message;
      try {
        message = JSON.parse(text);
      } catch (_) {
        return;
      }

      if (message.setupComplete) {
        console.log("[EASY-TALK] setupComplete");
        setupComplete = true;
        allowReconnect = true;
        reconnectAttempts = 0;
        switchingDirection = false;
        clearSetupTimers();
        actionBtn.disabled = false;
        actionBtn.textContent = "结束传译";
        actionBtn.classList.add("stop");
        badgeTextEl.textContent = "传译中";
        setVisualState("listening");
        setStatus("译向已就绪，请自然说话");
        if (!timerId) {
          startTimer();
        }
        try {
          await startMicrophone();
        } catch (error) {
          stopMicrophone(false);
          setStatus("无法访问麦克风，请检查浏览器权限", "error");
          setVisualState("error");
        }
        return;
      }

      if (message.type === "error" || message.error) {
        console.error("[EASY-TALK] Gemini/proxy error:", message);
        failSession(formatError(message));
        return;
      }

      const serverContent = message.serverContent;
      if (!serverContent) {
        return;
      }

      if (serverContent.inputTranscription) {
        const fragment = serverContent.inputTranscription.text || "";
        const langCode = normalizeLang(serverContent.inputTranscription.languageCode || "");
        if (langCode && lastInputLang && !sameLang(langCode, lastInputLang) && inputTranscript) {
          sealTranscripts();
        }
        if (langCode) {
          lastInputLang = langCode;
          lastDetectedCode = langCode;
          refreshLangUI();
          maybeSwitchDirection(langCode);
        }
        appendTranscript("source", fragment);
      }

      if (serverContent.outputTranscription) {
        appendTranscript("target", serverContent.outputTranscription.text || "");
      }

      if (serverContent.modelTurn && Array.isArray(serverContent.modelTurn.parts)) {
        for (const part of serverContent.modelTurn.parts) {
          if (part.inlineData && part.inlineData.data) {
            playPCM(part.inlineData.data);
          }
        }
      }

      if (serverContent.interrupted) {
        stopAudioPlayback();
        sealTranscripts();
      }

      if (serverContent.turnComplete) {
        sealTranscripts();
        if (talking) {
          setVisualState("listening");
          setStatus("继续说，我会持续翻译");
        }
      }
    }

    async function startMicrophone() {
      if (!connected || !setupComplete || talking) {
        return;
      }
      if (mediaStream || processorNode || inputContext) {
        stopMicrophone(false);
      }
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      inputContext = new AudioContext();
      await inputContext.resume();
      ensureOutputGraph();
      await outputContext.resume();
      sourceNode = inputContext.createMediaStreamSource(mediaStream);
      processorNode = inputContext.createScriptProcessor(4096, 1, 1);
      processorNode.onaudioprocess = (event) => {
        if (!talking || !ws || ws.readyState !== WebSocket.OPEN || !setupComplete) {
          return;
        }
        const input = event.inputBuffer.getChannelData(0);
        setMicLevel(Math.min(1, rmsLevel(input) * 4.2));
        const downsampled = downsampleTo16k(input, inputContext.sampleRate);
        const message = {
          realtimeInput: {
            audio: {
              data: arrayBufferToBase64(floatTo16BitPCM(downsampled)),
              mimeType: "audio/pcm;rate=16000"
            }
          }
        };
        try {
          ws.send(JSON.stringify(message));
        } catch (_) { }
      };
      sourceNode.connect(processorNode);
      silentGain = inputContext.createGain();
      silentGain.gain.value = 0;
      processorNode.connect(silentGain);
      silentGain.connect(inputContext.destination);
      talking = true;
      setVisualState("listening");
    }

    function stopMicrophone(sendAudioStreamEnd) {
      const wasTalking = talking;
      talking = false;
      setMicLevel(0);
      if (sendAudioStreamEnd && wasTalking && ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
        } catch (_) { }
      }
      if (processorNode) {
        try {
          processorNode.disconnect();
        } catch (_) { }
        processorNode.onaudioprocess = null;
        processorNode = null;
      }
      if (silentGain) {
        try {
          silentGain.disconnect();
        } catch (_) { }
        silentGain = null;
      }
      if (sourceNode) {
        try {
          sourceNode.disconnect();
        } catch (_) { }
        sourceNode = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => {
          try {
            track.stop();
          } catch (_) { }
        });
        mediaStream = null;
      }
      if (inputContext) {
        try {
          inputContext.close();
        } catch (_) { }
        inputContext = null;
      }
    }

    async function playPCM(base64) {
      if (!base64 || muted) {
        return;
      }
      const context = ensureOutputGraph();
      if (context.state === "suspended") {
        try {
          await context.resume();
        } catch (_) {
          return;
        }
      }
      const int16 = new Int16Array(base64ToArrayBuffer(base64));
      if (!int16.length) {
        return;
      }
      const audioBuffer = context.createBuffer(1, int16.length, 24000);
      const channel = audioBuffer.getChannelData(0);
      for (let i = 0; i < int16.length; i++) {
        channel[i] = int16[i] / 32768;
      }
      const source = context.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(outputGain);
      activeAudioSources.add(source);
      source.onended = () => {
        activeAudioSources.delete(source);
      };
      const now = context.currentTime;
      if (nextPlayTime < now) {
        nextPlayTime = now;
      }
      try {
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;
        setVisualState("translating");
        setStatus("正在译出语音");
        if (speakingTimer) {
          clearTimeout(speakingTimer);
        }
        const remainingMs = Math.max(0, (nextPlayTime - context.currentTime) * 1000);
        speakingTimer = setTimeout(() => {
          if (talking) {
            setVisualState("listening");
            setStatus("继续说，我会持续翻译");
          }
        }, remainingMs + 160);
      } catch (_) {
        activeAudioSources.delete(source);
      }
    }

    function stopAudioPlayback() {
      for (const source of activeAudioSources) {
        try {
          source.stop();
        } catch (_) { }
        try {
          source.disconnect();
        } catch (_) { }
      }
      activeAudioSources.clear();
      if (speakingTimer) {
        clearTimeout(speakingTimer);
        speakingTimer = null;
      }
      nextPlayTime = outputContext ? outputContext.currentTime : 0;
    }

    async function reconnectSession(reason) {
      switchingDirection = true;
      allowReconnect = false;
      clearSetupTimers();
      setStatus(reason || "正在切换译向…");
      badgeTextEl.textContent = "切换中";
      setVisualState("connecting");
      stopMicrophone(false);
      stopAudioPlayback();
      sealTranscripts();
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        try {
          ws.close(1000, "Retarget");
        } catch (_) { }
      } else if (sessionWanted) {
        connect();
      }
    }

    async function startSession() {
      sessionWanted = true;
      manualClosing = false;
      allowReconnect = false;
      reconnectAttempts = 0;
      switchingDirection = false;
      await requestScreenWakeLock();
      await connect();
    }

    function stopSession() {
      sessionWanted = false;
      switchingDirection = false;
      allowReconnect = false;
      clearSetupTimers();
      manualClosing = true;
      actionBtn.disabled = true;
      setStatus("正在结束传译");
      releaseScreenWakeLock();
      stopMicrophone(true);
      stopAudioPlayback();
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        try {
          ws.close(1000, "Session ended");
        } catch (_) { }
      } else {
        actionBtn.disabled = false;
        actionBtn.textContent = "开始传译";
        actionBtn.classList.remove("stop");
        badgeTextEl.textContent = "离线";
        setVisualState("idle");
        stopTimer();
        sealTranscripts();
        setStatus("传译已结束，随时可以再次开始");
      }
    }

    actionBtn.addEventListener("click", async () => {
      if (connected || connecting || sessionWanted) {
        stopSession();
        return;
      }
      await startSession();
    });

    sourceBtn.addEventListener("click", () => openLangPicker("source"));
    targetBtn.addEventListener("click", () => openLangPicker("target"));
    swapBtn.addEventListener("click", () => {
      swapLanguages();
    });
    echoBtn.addEventListener("click", async () => {
      echoTargetLanguage = !echoTargetLanguage;
      saveSettings();
      refreshLangUI();
      if (sessionWanted && !isTwoWay()) {
        await reconnectSession("已更新回声设置，正在重连");
      }
    });
    muteBtn.addEventListener("click", () => {
      muted = !muted;
      applyOutputGain();
      refreshLangUI();
    });
    copyBtn.addEventListener("click", async () => {
      const liveSource = inputTranscript;
      const liveTarget = outputTranscript;
      const blocks = history.map((item, index) => {
        return `${index + 1}. [${item.sourceLang}] ${item.source}\n   [${item.targetLang}] ${item.target}`;
      });
      if (liveSource || liveTarget) {
        blocks.push(`${blocks.length + 1}. [${lastDetectedCode || sourceLang}] ${liveSource}\n   [${targetLang}] ${liveTarget}`);
      }
      const text = blocks.join("\n\n") || "还没有可复制的字幕";
      try {
        await navigator.clipboard.writeText(text);
        setStatus("字幕已复制");
      } catch (_) {
        setStatus("复制失败，请检查浏览器权限", "error");
      }
    });
    clearBtn.addEventListener("click", () => {
      resetTranscripts(true);
      setStatus(sessionWanted ? "字幕已清空，传译仍在继续" : "字幕已清空");
    });
    settingsBtn.addEventListener("click", () => {
      volumeEl.value = String(Math.round(volume * 100));
      apiOriginEl.value = apiOrigin;
      openSheet(settingsSheetEl);
    });
    closeLangBtn.addEventListener("click", closeSheets);
    closeSettingsBtn.addEventListener("click", closeSheets);
    maskEl.addEventListener("click", closeSheets);
    langSearchEl.addEventListener("input", renderLangPicker);
    volumeEl.addEventListener("input", () => {
      volume = Number(volumeEl.value) / 100;
      if (volume > 0) {
        muted = false;
      }
      applyOutputGain();
      saveSettings();
      refreshLangUI();
    });
    apiOriginEl.addEventListener("change", () => {
      apiOrigin = apiOriginEl.value.trim().replace(/\/$/, "") || DEFAULT_API_ORIGIN;
      saveSettings();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && wakeLockWanted) {
        requestScreenWakeLock();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space" || event.repeat) {
        return;
      }
      const tag = (event.target && event.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") {
        return;
      }
      event.preventDefault();
      actionBtn.click();
    });

    window.addEventListener("beforeunload", () => {
      manualClosing = true;
      sessionWanted = false;
      clearSetupTimers();
      releaseScreenWakeLock();
      stopMicrophone(false);
      stopAudioPlayback();
      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.close(1000, "Page closed");
        } catch (_) { }
      }
    });

    loadSettings();
    apiOriginEl.value = apiOrigin;
    volumeEl.value = String(Math.round(volume * 100));
    refreshLangUI();
  </script>
</body>

</html>
